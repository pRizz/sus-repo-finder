<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>{% block title %}Sus Repo Finder{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0d1117',
                            surface: '#161b22',
                            border: '#21262d',
                        },
                        severity: {
                            high: '#f85149',
                            medium: '#d29922',
                            low: '#e3b341',
                        },
                        success: '#3fb950',
                        accent: '#58a6ff',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        }
        code, pre {
            font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        }
        /* Accessibility: Focus ring styles for keyboard navigation */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        [role="button"]:focus-visible,
        [tabindex]:focus-visible {
            outline: 2px solid #58a6ff;
            outline-offset: 2px;
        }
        /* Remove outline for mouse users (only show for keyboard navigation) */
        a:focus:not(:focus-visible),
        button:focus:not(:focus-visible) {
            outline: none;
        }
        /* Loading overlay styles */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 17, 23, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(2px);
        }
        #loading-overlay.active {
            display: flex;
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #21262d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .loading-text {
            color: #c9d1d9;
            font-size: 14px;
            font-weight: 500;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* Search spinner */
        .search-spinner {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border: 2px solid #21262d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .search-form.loading .search-spinner {
            display: block;
        }
        /* Skeleton loading for content */
        .skeleton {
            background: linear-gradient(90deg, #21262d 25%, #30363d 50%, #21262d 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s ease-in-out infinite;
            border-radius: 4px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-dark-bg text-gray-200 min-h-screen overflow-x-hidden">
    <!-- Loading Overlay -->
    <div id="loading-overlay" aria-label="Loading" role="status">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <span class="loading-text">Loading...</span>
        </div>
    </div>

    <nav class="bg-dark-surface border-b border-dark-border">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center min-w-0">
                    <a href="/" class="text-lg sm:text-xl font-bold text-white hover:text-blue-400 transition-colors flex-shrink-0" data-loading="true">
                        Sus Repo Finder
                    </a>
                    <div class="hidden sm:flex ml-6 lg:ml-10 items-baseline space-x-2 lg:space-x-4">
                        <a href="/" class="text-gray-300 hover:text-white px-2 lg:px-3 py-2 rounded-md text-sm font-medium transition-colors" data-loading="true">
                            Dashboard
                        </a>
                        <a href="/crates" class="text-gray-300 hover:text-white px-2 lg:px-3 py-2 rounded-md text-sm font-medium transition-colors" data-loading="true">
                            Crates
                        </a>
                    </div>
                </div>
                <div class="flex items-center ml-2 sm:ml-4">
                    <form action="/crates" method="get" class="search-form relative" id="search-form" role="search">
                        <label for="nav-search" class="sr-only">Search crates</label>
                        <input type="search" id="nav-search" name="search" placeholder="Search..."
                               aria-label="Search crates"
                               class="bg-dark-bg border border-dark-border rounded-lg px-3 sm:px-4 py-2 pr-8 sm:pr-10 text-sm text-gray-200 placeholder-gray-400 focus:outline-none focus:border-blue-500 w-28 sm:w-48 lg:w-64">
                        <div class="search-spinner"></div>
                    </form>
                </div>
            </div>
            <!-- Mobile nav links -->
            <div class="sm:hidden flex items-center justify-center gap-4 pb-3 -mt-1">
                <a href="/" class="text-gray-300 hover:text-white px-3 py-1 rounded-md text-sm font-medium transition-colors" data-loading="true">
                    Dashboard
                </a>
                <a href="/crates" class="text-gray-300 hover:text-white px-3 py-1 rounded-md text-sm font-medium transition-colors" data-loading="true">
                    Crates
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 overflow-x-hidden">
        {% block breadcrumbs %}{% endblock %}
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark-surface border-t border-dark-border mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-2">
                    <span class="text-white font-semibold">Sus Repo Finder</span>
                    <span class="text-gray-500">|</span>
                    <span class="text-gray-400 text-sm">Detecting suspicious patterns in Rust crates</span>
                </div>
                <nav class="flex items-center gap-6">
                    <a href="/" class="text-gray-400 hover:text-white text-sm transition-colors">Dashboard</a>
                    <a href="/crates" class="text-gray-400 hover:text-white text-sm transition-colors">Crates</a>
                    <a href="https://crates.io" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-accent text-sm transition-colors flex items-center gap-1">
                        crates.io
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                        </svg>
                    </a>
                    <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="text-gray-400 hover:text-accent text-sm transition-colors flex items-center gap-1">
                        GitHub
                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                        </svg>
                    </a>
                </nav>
            </div>
            <div class="mt-4 pt-4 border-t border-dark-border text-center text-gray-500 text-xs">
                Built with Rust, Axum, and htmx. Data sourced from crates.io.
            </div>
        </div>
    </footer>

    <script>
        // Loading state management
        (function() {
            const loadingOverlay = document.getElementById('loading-overlay');
            const searchForm = document.getElementById('search-form');

            // Show loading overlay
            function showLoading() {
                if (loadingOverlay) {
                    loadingOverlay.classList.add('active');
                }
            }

            // Hide loading overlay
            function hideLoading() {
                if (loadingOverlay) {
                    loadingOverlay.classList.remove('active');
                }
            }

            // Show search spinner
            function showSearchSpinner() {
                if (searchForm) {
                    searchForm.classList.add('loading');
                }
            }

            // Handle navigation links with data-loading attribute
            document.querySelectorAll('a[data-loading="true"]').forEach(function(link) {
                link.addEventListener('click', function(e) {
                    // Only show loading for same-origin navigation
                    if (link.href && link.href.startsWith(window.location.origin)) {
                        showLoading();
                    }
                });
            });

            // Handle all internal links (crate links, pagination, etc.)
            document.querySelectorAll('a[href^="/"]').forEach(function(link) {
                link.addEventListener('click', function(e) {
                    // Don't show loading for same-page anchors
                    if (!link.href.includes('#')) {
                        showLoading();
                    }
                });
            });

            // Handle search form submission
            if (searchForm) {
                searchForm.addEventListener('submit', function(e) {
                    showSearchSpinner();
                    showLoading();
                });
            }

            // Handle sort dropdown changes (which trigger page navigation)
            const sortDropdown = document.getElementById('sort');
            if (sortDropdown) {
                sortDropdown.addEventListener('change', function() {
                    showLoading();
                });
            }

            // Handle browser back/forward navigation
            window.addEventListener('pageshow', function(event) {
                // Hide loading when page is shown (including from bfcache)
                hideLoading();
                if (searchForm) {
                    searchForm.classList.remove('loading');
                }
            });

            // Hide loading on page load (in case of fast loads)
            window.addEventListener('load', function() {
                hideLoading();
            });

            // Expose functions globally for use by other scripts
            window.showLoading = showLoading;
            window.hideLoading = hideLoading;
        })();
    </script>
</body>
</html>
